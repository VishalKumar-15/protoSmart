server:
  port: 8081

spring:
  application:
    name: protoSmart


  datasource:
    url: jdbc:mysql://localhost:3306/schooldb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
      show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.xml
